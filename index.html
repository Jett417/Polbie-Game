<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9edf3">
<title>Polbie Recruit</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#e9edf3}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
.app{width:min(760px,100%);background:#fff;border:3px solid #111;border-radius:24px;padding:18px;text-align:center}
h1{margin:4px 0;font-size:clamp(26px,7vw,40px)}
.subtitle{margin:0 0 14px;color:#666}
.result{position:relative;min-height:460px;border:3px dashed #aaa;border-radius:18px;background:#fafafa;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.rarity{position:absolute;top:8px;left:8px;width:min(30vw,155px);z-index:2}
#polbie{width:min(65vw,330px);height:min(55vh,330px);object-fit:contain}
#name{font-size:clamp(25px,7vw,34px);font-weight:900}
#status{min-height:25px;color:#555}
#count{font-weight:800;margin:12px}
button{width:min(90%,420px);min-height:64px;font-size:clamp(22px,6vw,28px);font-weight:900;border:3px solid #111;border-radius:16px;background:#ffd21c;touch-action:manipulation}
</style>
</head>
<body>
<main class="app">
<h1>POLBIE RECRUIT</h1>
<p class="subtitle">Massive Banner prototype</p>
<section class="result">
<img class="rarity" id="rarity" src="common.png" alt="Common">
<img id="polbie" alt="Recruited Polbie">
<div id="name">READY</div>
<div id="status">Press RECRUIT to begin.</div>
</section>
<div id="count">Recruited this session: 0</div>
<button id="recruit" type="button">RECRUIT</button>
</main>
<script>
const odds=[
  ["Common",53,"common.png"],
  ["Uncommon",32,"uncommon.png"],
  ["Rare",15,"rare.png"]
];
const polbies={
  Common:[
    ["Bolivia","bolivia.png"],["Nepal","nepal.png"],
    ["Niger","niger.png"],["East Timor","east_timor.png"]
    ,["Vatican City","vatican.png"]
    ],
  Uncommon:[
  ["Switzerland","switzerland.png"]
]
  Rare:[["Chile","chile.png"]]
};
let count=0;

function chooseRarity(){
  let roll=Math.random()*100;
  for(const item of odds){
    if(roll<item[1]) return item;
    roll-=item[1];
  }
  return odds[0];
}

function recruit(){
  const rarity=chooseRarity();
  const list=polbies[rarity[0]];
  const chosen=list[Math.floor(Math.random()*list.length)];
  count++;
  document.getElementById("rarity").src=rarity[2];
  document.getElementById("rarity").alt=rarity[0];
  document.getElementById("polbie").src=chosen[1];
  document.getElementById("name").textContent=chosen[0];
  document.getElementById("status").textContent=rarity[0]+" • You recruited "+chosen[0]+"!";
  document.getElementById("count").textContent="Recruited this session: "+count;
}
document.getElementById("recruit").addEventListener("click",recruit);
</script>
</body>
</html>
